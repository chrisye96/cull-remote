<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>LR Remote Cull</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="status" role="status" hidden></div>

  <main id="sources" hidden>
    <div class="home-side">
      <header class="home-header">
        <h1>图库</h1>
        <div class="home-actions">
          <button id="open-settings" type="button">设置</button>
          <button id="refresh-sources" type="button">刷新</button>
        </div>
      </header>
      <div class="search-box">
        <svg class="icon search-icon" aria-hidden="true"><use href="/vendor/lucide.svg#search"></use></svg>
        <input id="source-search" type="search" placeholder="搜索文件夹或收藏夹" aria-label="搜索文件夹或收藏夹" autocomplete="off" enterkeyhint="search">
        <button id="search-clear" type="button" aria-label="清除搜索" hidden><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#x"></use></svg></button>
      </div>
      <div class="home-sorts">
        <label>文件夹排序
          <select id="folder-sort">
            <option value="name-desc">名称 ↓</option>
            <option value="name-asc">名称 ↑</option>
            <option value="import">导入顺序</option>
          </select>
        </label>
        <label>照片顺序
          <select id="photo-sort">
            <option value="time-asc">拍摄时间 ↑</option>
            <option value="time-desc">拍摄时间 ↓</option>
            <option value="name">文件名</option>
          </select>
        </label>
        <button id="to-top" type="button" aria-label="回到顶部"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#arrow-up-to-line"></use></svg><span>回到顶部</span></button>
      </div>
    </div>
    <div id="home-list" class="home-list">
      <ul id="source-list"></ul>
    </div>
  </main>

  <main id="settings" hidden>
    <header class="settings-header">
      <button id="settings-back" type="button"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#chevron-left"></use></svg><span>返回</span></button>
      <h1>设置</h1>
    </header>
    <div class="settings-body">
      <section class="settings-group">
        <h2>筛片</h2>
        <label class="setting">预览清晰度
          <select id="set-quality">
            <option value="auto">自动（按设备）</option>
            <option value="std">标准</option>
            <option value="hd">高清</option>
          </select>
        </label>
        <label class="setting">打标后跳到下一张
          <select id="set-advance">
            <option value="flag">仅留用和弃用</option>
            <option value="any">任何标记</option>
            <option value="never">不跳转</option>
          </select>
        </label>
        <label class="setting">进入文件夹时显示
          <select id="set-filter">
            <option value="unmarked">未标记</option>
            <option value="all">全部</option>
          </select>
        </label>
        <label class="setting">左手模式（横屏时操作栏在左侧）
          <input id="set-left-hand" type="checkbox">
        </label>
      </section>
      <section class="settings-group">
        <h2>离线缓存</h2>
        <label class="setting">在家时自动缓存未标记照片
          <input id="set-auto-cache" type="checkbox">
        </label>
        <label class="setting">自动缓存上限
          <select id="set-auto-limit">
            <option value="100">100 张</option>
            <option value="200">200 张</option>
            <option value="500">500 张</option>
            <option value="1000">1000 张</option>
          </select>
        </label>
        <p id="cache-usage" class="setting"></p>
        <div class="setting">
          <button id="clear-cache" type="button">清除缓存</button>
        </div>
        <p class="note">只清除这台设备上的预览图和照片列表。Lightroom 里的照片和还没同步的标记都不受影响。</p>
      </section>
      <section class="settings-group">
        <h2>连接</h2>
        <dl id="conn-info"></dl>
        <figure id="conn-pair" class="pair" hidden>
          <img id="conn-qr" alt="连接地址的二维码" width="180" height="180">
          <figcaption class="note">另一台设备登录同一个 Tailscale 账号后，扫这个码就能打开。</figcaption>
        </figure>
        <p id="home-screen-tip" class="note" hidden>建议在 Safari 里"添加到主屏幕"后从图标打开：可以全屏使用，离线数据也不会因为 7 天没有访问而被系统清理。</p>
      </section>
    </div>
  </main>

  <main id="viewer" hidden>
    <header>
      <button id="back" type="button"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#chevron-left"></use></svg><span>返回</span></button>
      <span id="title"><span id="photo-name"></span><span id="photo-pos"></span></span>
      <div id="filter" class="segmented" role="group" aria-label="筛选">
        <button type="button" data-filter="unmarked">未标记<span class="count"></span></button>
        <button type="button" data-filter="all">全部<span class="count"></span></button>
      </div>
    </header>
    <div id="stage">
      <img id="photo" alt="">
      <div id="badges" aria-hidden="true" hidden>
        <span class="part mark-flag"><svg class="icon pick-icon"><use href="/vendor/lucide.svg#flag"></use></svg><svg class="icon reject-icon"><use href="/vendor/lucide.svg#ban"></use></svg></span>
        <span class="part mark-rating"><svg class="icon"><use href="/vendor/lucide.svg#star"></use></svg><span class="value"></span></span>
        <span class="part mark-label"><span class="dot"></span></span>
        <span class="part mark-unsynced"><svg class="icon"><use href="/vendor/lucide.svg#cloud-off"></use></svg></span>
      </div>
      <div id="flash" aria-hidden="true"></div>
      <div id="pull" aria-hidden="true"></div>
      <span id="tap-prev" class="tap-hint" aria-hidden="true"><svg class="icon"><use href="/vendor/lucide.svg#chevron-left"></use></svg></span>
      <span id="tap-next" class="tap-hint" aria-hidden="true"><svg class="icon"><use href="/vendor/lucide.svg#chevron-right"></use></svg></span>
      <span id="caption" hidden></span>
      <p id="empty" hidden></p>
    </div>
    <aside id="side">
      <p id="error" role="alert" hidden></p>
      <footer id="actions">
        <div class="row flags">
          <button type="button" class="flag" data-field="pickStatus" data-value="1"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#flag"></use></svg><span>留用</span></button>
          <button type="button" class="flag" data-field="pickStatus" data-value="-1"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#ban"></use></svg><span>弃用</span></button>
        </div>
        <div class="row stars">
          <button type="button" data-field="rating" data-value="1" aria-label="1 星"><svg aria-hidden="true"><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="2" aria-label="2 星"><svg aria-hidden="true"><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="3" aria-label="3 星"><svg aria-hidden="true"><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="4" aria-label="4 星"><svg aria-hidden="true"><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="5" aria-label="5 星"><svg aria-hidden="true"><use href="/vendor/lucide.svg#star"></use></svg></button>
        </div>
        <div class="row swatches">
          <button type="button" class="red" data-field="label" data-value="red" aria-label="红色"><svg class="icon check" aria-hidden="true"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="yellow" data-field="label" data-value="yellow" aria-label="黄色"><svg class="icon check" aria-hidden="true"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="green" data-field="label" data-value="green" aria-label="绿色"><svg class="icon check" aria-hidden="true"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="blue" data-field="label" data-value="blue" aria-label="蓝色"><svg class="icon check" aria-hidden="true"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="purple" data-field="label" data-value="purple" aria-label="紫色"><svg class="icon check" aria-hidden="true"><use href="/vendor/lucide.svg#check"></use></svg></button>
        </div>
      </footer>
    </aside>
  </main>

  <dialog id="cache-dialog" aria-labelledby="cache-title">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="cache-title" tabindex="-1"></h2>
        <button id="cache-close" type="button" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="/vendor/lucide.svg#x"></use></svg></button>
      </div>
      <p id="cache-note"></p>
      <button id="cache-unmarked" type="button" class="choice" disabled><span>缓存未标记</span><span class="choice-detail"></span></button>
      <button id="cache-all" type="button" class="choice" disabled><span>缓存全部</span><span class="choice-detail"></span></button>
      <p class="note">预览图只保存在这台设备上。缓存期间请保持这个页面在前台，不要锁屏；中断后再点一次会从断点继续。</p>
      <progress id="cache-progress" hidden></progress>
      <p id="cache-state" role="status"></p>
      <button id="cache-cancel" type="button" hidden>取消</button>
    </div>
  </dialog>
</body>
</html>
