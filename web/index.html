  <!-- All text comes from js/strings.js: data-i18n names the key, see js/i18n.js. -->
  <div id="status" role="status" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>

  <main id="sources" tabindex="-1" aria-labelledby="home-title" hidden>
    <div class="home-side">
      <header class="home-header">
        <h1 id="home-title" data-i18n="home.title"></h1>
        <div class="home-actions">
          <button id="open-settings" type="button" data-i18n="settings.title"></button>
          <button id="refresh-sources" type="button" data-i18n="home.refresh"></button>
        </div>
      </header>
      <div class="search-box">
        <svg class="icon search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="source-search" type="search" data-i18n-placeholder="home.search" data-i18n-aria-label="home.search" autocomplete="off" enterkeyhint="search">
        <button id="search-clear" type="button" data-i18n-aria-label="home.searchClear" hidden><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>
      <div class="home-sorts">
        <label><span data-i18n="sort.folders"></span>
          <select id="folder-sort">
            <option value="name-desc" data-i18n="sort.nameDesc"></option>
            <option value="name-asc" data-i18n="sort.nameAsc"></option>
            <option value="import" data-i18n="sort.import"></option>
          </select>
        </label>
        <label><span data-i18n="sort.photos"></span>
          <select id="photo-sort">
            <option value="time-asc" data-i18n="sort.timeAsc"></option>
            <option value="time-desc" data-i18n="sort.timeDesc"></option>
            <option value="name" data-i18n="sort.fileName"></option>
          </select>
        </label>
        <button id="to-top" type="button" data-i18n-aria-label="home.toTop"><svg class="icon" aria-hidden="true"><use href="#i-arrow-up-to-line"></use></svg><span data-i18n="home.toTop"></span></button>
      </div>
    </div>
    <div id="home-list" class="home-list">
      <ul id="source-list"></ul>
    </div>
  </main>

  <main id="settings" tabindex="-1" aria-labelledby="settings-title" hidden>
    <header class="settings-header">
      <button id="settings-back" type="button"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg><span data-i18n="common.back"></span></button>
      <h1 id="settings-title" data-i18n="settings.title"></h1>
    </header>
    <div class="settings-body">
      <section class="settings-group">
        <h2 data-i18n="settings.culling"></h2>
        <label class="setting"><span data-i18n="settings.quality"></span>
          <select id="set-quality">
            <option value="auto" data-i18n="quality.auto"></option>
            <option value="std" data-i18n="quality.std"></option>
            <option value="hd" data-i18n="quality.hd"></option>
          </select>
        </label>
        <label class="setting"><span data-i18n="settings.advance"></span>
          <select id="set-advance">
            <option value="flag" data-i18n="advance.flag"></option>
            <option value="any" data-i18n="advance.any"></option>
            <option value="never" data-i18n="advance.never"></option>
          </select>
        </label>
        <label class="setting"><span data-i18n="settings.defaultFilter"></span>
          <select id="set-filter">
            <option value="unmarked" data-i18n="filter.unmarked"></option>
            <option value="all" data-i18n="filter.all"></option>
          </select>
        </label>
        <label class="setting"><span data-i18n="settings.leftHand"></span>
          <input id="set-left-hand" type="checkbox">
        </label>
        <label class="setting"><span data-i18n="settings.language"></span>
          <select id="set-language">
            <option value="auto" data-i18n="settings.languageAuto"></option>
          </select>
        </label>
      </section>
      <section class="settings-group">
        <h2 id="set-info-title" data-i18n="exif.title"></h2>
        <div class="setting check-list" role="group" aria-labelledby="set-info-title">
          <label><input id="set-info-histogram" type="checkbox"><span data-i18n="exif.histogram"></span></label>
          <label><input id="set-info-exposure" type="checkbox"><span data-i18n="exif.exposure"></span></label>
          <label><input id="set-info-lens" type="checkbox"><span data-i18n="exif.lens"></span></label>
        </div>
        <p class="note" data-i18n="exif.note"></p>
      </section>
      <section class="settings-group">
        <h2 data-i18n="settings.offline"></h2>
        <label class="setting"><span data-i18n="settings.autoCache"></span>
          <input id="set-auto-cache" type="checkbox">
        </label>
        <label class="setting"><span data-i18n="settings.autoLimit"></span>
          <select id="set-auto-limit">
            <option value="100" data-i18n="count.photos" data-n="100"></option>
            <option value="200" data-i18n="count.photos" data-n="200"></option>
            <option value="500" data-i18n="count.photos" data-n="500"></option>
            <option value="1000" data-i18n="count.photos" data-n="1000"></option>
          </select>
        </label>
        <p id="cache-usage" class="setting"></p>
        <div class="setting">
          <button id="clear-cache" type="button" data-i18n="settings.clearCache"></button>
        </div>
        <p class="note" data-i18n="settings.clearNote"></p>
      </section>
      <section class="settings-group">
        <h2 data-i18n="settings.connection"></h2>
        <dl id="conn-info"></dl>
        <figure id="conn-pair" class="pair" hidden>
          <img id="conn-qr" data-i18n-alt="settings.qrAlt" width="180" height="180">
          <figcaption class="note" data-i18n="settings.qrNote"></figcaption>
        </figure>
        <p id="home-screen-tip" class="note" data-i18n="settings.homeScreenTip" hidden></p>
      </section>
    </div>
  </main>

  <main id="viewer" tabindex="-1" aria-labelledby="title" hidden>
    <header>
      <div id="tools">
      <button id="back" type="button"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg><span data-i18n="common.back"></span></button>
      <button id="grid-toggle" type="button" aria-pressed="false" data-i18n-aria-label="viewer.grid" hidden><svg class="icon to-grid" aria-hidden="true"><use href="#i-layout-grid"></use></svg><svg class="icon to-photo" aria-hidden="true"><use href="#i-image"></use></svg></button>
      <button id="mark-filter" type="button" hidden><span id="mark-sign" aria-hidden="true"></span><span id="mark-name" class="sr-only"></span></button>
      </div>
      <dialog id="mark-menu" data-i18n-aria-label="filter.label"><div class="mark-menu" tabindex="-1"></div></dialog>
      <span id="title"><span id="photo-name"></span><span id="photo-pos"></span></span>
      <div id="filter" class="segmented" role="group" data-i18n-aria-label="filter.label">
        <button type="button" data-filter="unmarked"><span data-i18n="filter.unmarked"></span><span class="count"></span></button>
        <button type="button" data-filter="all"><span data-i18n="filter.all"></span><span class="count"></span></button>
      </div>
      <!-- Swipes and edge taps are out of reach for a keyboard, a switch or a screen reader. -->
      <button id="prev-photo" type="button" class="sr-only" data-i18n="viewer.prev"></button>
      <button id="next-photo" type="button" class="sr-only" data-i18n="viewer.next"></button>
    </header>
    <div id="view">
    <div id="stage">
      <img id="photo" alt="">
      <div id="badges" aria-hidden="true" hidden>
        <span class="part mark-flag"><svg class="icon pick-icon"><use href="#i-flag"></use></svg><svg class="icon reject-icon"><use href="#i-ban"></use></svg></span>
        <span class="part mark-rating"><svg class="icon"><use href="#i-star"></use></svg><span class="value"></span></span>
        <span class="part mark-label"><span class="dot"></span></span>
        <span class="part mark-unsynced"><svg class="icon"><use href="#i-cloud-off"></use></svg></span>
      </div>
      <button id="info" type="button" aria-expanded="true" hidden>
        <span class="sr-only" data-i18n="exif.title"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-chart-no-axes-column"></use></svg>
        <canvas id="histogram" width="512" height="192" aria-hidden="true"></canvas>
        <span id="exposure"></span>
        <span id="lens"></span>
      </button>
      <div id="flash" aria-hidden="true"></div>
      <div id="pull" aria-hidden="true"></div>
      <span id="tap-prev" class="tap-hint" aria-hidden="true"><svg class="icon"><use href="#i-chevron-left"></use></svg></span>
      <span id="tap-next" class="tap-hint" aria-hidden="true"><svg class="icon"><use href="#i-chevron-right"></use></svg></span>
      <span id="caption" aria-hidden="true" hidden></span>
      <p id="empty" role="status" hidden></p>
    </div>
    <div id="grid" data-i18n-aria-label="viewer.grid" hidden></div>
    </div>
    <aside id="side">
      <p id="error" role="alert" hidden></p>
      <footer id="actions">
        <div class="row flags">
          <button type="button" class="flag" data-field="pickStatus" data-value="1"><svg class="icon" aria-hidden="true"><use href="#i-flag"></use></svg><span data-i18n="mark.pick"></span></button>
          <button type="button" class="flag" data-field="pickStatus" data-value="-1"><svg class="icon" aria-hidden="true"><use href="#i-ban"></use></svg><span data-i18n="mark.reject"></span></button>
        </div>
        <div class="row stars">
          <button type="button" data-field="rating" data-value="1" data-i18n-aria-label="mark.stars" data-n="1"><svg aria-hidden="true"><use href="#i-star"></use></svg></button>
          <button type="button" data-field="rating" data-value="2" data-i18n-aria-label="mark.stars" data-n="2"><svg aria-hidden="true"><use href="#i-star"></use></svg></button>
          <button type="button" data-field="rating" data-value="3" data-i18n-aria-label="mark.stars" data-n="3"><svg aria-hidden="true"><use href="#i-star"></use></svg></button>
          <button type="button" data-field="rating" data-value="4" data-i18n-aria-label="mark.stars" data-n="4"><svg aria-hidden="true"><use href="#i-star"></use></svg></button>
          <button type="button" data-field="rating" data-value="5" data-i18n-aria-label="mark.stars" data-n="5"><svg aria-hidden="true"><use href="#i-star"></use></svg></button>
        </div>
        <div class="row swatches">
          <button type="button" class="red" data-field="label" data-value="red" data-i18n-aria-label="label.red"><svg class="icon check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="yellow" data-field="label" data-value="yellow" data-i18n-aria-label="label.yellow"><svg class="icon check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="green" data-field="label" data-value="green" data-i18n-aria-label="label.green"><svg class="icon check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="blue" data-field="label" data-value="blue" data-i18n-aria-label="label.blue"><svg class="icon check" aria-hidden="true"><use href="#i-check"></use></svg></button>
          <button type="button" class="purple" data-field="label" data-value="purple" data-i18n-aria-label="label.purple"><svg class="icon check" aria-hidden="true"><use href="#i-check"></use></svg></button>
        </div>
      </footer>
    </aside>
  </main>

  <dialog id="cache-dialog" aria-labelledby="cache-title">
    <div class="dialog-body">
      <div class="dialog-head">
        <h2 id="cache-title" tabindex="-1"></h2>
        <button id="cache-close" type="button" data-i18n-aria-label="cache.close"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
      </div>
      <p id="cache-note"></p>
      <button id="cache-unmarked" type="button" class="choice" disabled><span data-i18n="cache.unmarked"></span><span class="choice-detail"></span></button>
      <button id="cache-all" type="button" class="choice" disabled><span data-i18n="cache.all"></span><span class="choice-detail"></span></button>
      <details id="cache-marks" hidden><summary data-i18n="cache.byMark"></summary><div class="mark-menu"></div></details>
      <button id="cache-marked" type="button" class="choice" hidden><span class="choice-title"></span><span class="choice-detail"></span></button>
      <button id="cache-delete" type="button" hidden></button>
      <p class="note" data-i18n="cache.keepOpen"></p>
      <progress id="cache-progress" aria-labelledby="cache-title" hidden></progress>
      <p id="cache-state" role="status"></p>
      <button id="cache-cancel" type="button" data-i18n="cache.cancel" hidden></button>
    </div>
  </dialog>
</body>
</html>
