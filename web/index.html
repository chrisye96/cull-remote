<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111111">
  <title>LR Remote Cull</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div id="status" role="status" hidden></div>

  <main id="sources" hidden>
    <div class="home-side">
      <header class="home-header">
        <h1>图库</h1>
        <button id="refresh-sources" type="button">刷新</button>
      </header>
      <div class="search-box">
        <svg class="icon search-icon" aria-hidden="true"><use href="/vendor/lucide.svg#search"></use></svg>
        <input id="source-search" type="search" placeholder="搜索文件夹或收藏夹" aria-label="搜索文件夹或收藏夹" autocomplete="off" enterkeyhint="search">
        <button id="search-clear" type="button" aria-label="清除搜索" hidden><svg class="icon"><use href="/vendor/lucide.svg#x"></use></svg></button>
      </div>
      <div class="home-sorts">
        <label>文件夹排序
          <select id="folder-sort">
            <option value="name-desc">名称 ↓</option>
            <option value="name-asc">名称 ↑</option>
            <option value="import">导入顺序</option>
          </select>
        </label>
        <label>照片顺序
          <select id="photo-sort">
            <option value="time-asc">拍摄时间 ↑</option>
            <option value="time-desc">拍摄时间 ↓</option>
            <option value="name">文件名</option>
          </select>
        </label>
      </div>
    </div>
    <div id="home-list" class="home-list">
      <ul id="source-list"></ul>
    </div>
  </main>

  <main id="viewer" hidden>
    <header>
      <button id="back" type="button"><svg class="icon"><use href="/vendor/lucide.svg#chevron-left"></use></svg><span>返回</span></button>
      <span id="title"><span id="photo-name"></span><span id="photo-pos"></span></span>
      <div id="filter" class="segmented" role="group" aria-label="筛选">
        <button type="button" data-filter="unmarked">未标记<span class="count"></span></button>
        <button type="button" data-filter="all">全部<span class="count"></span></button>
      </div>
    </header>
    <div id="stage">
      <img id="photo" alt="">
      <div id="badges" aria-hidden="true" hidden>
        <span class="part mark-flag"><svg class="icon pick-icon"><use href="/vendor/lucide.svg#flag"></use></svg><svg class="icon reject-icon"><use href="/vendor/lucide.svg#ban"></use></svg></span>
        <span class="part mark-rating"><svg class="icon"><use href="/vendor/lucide.svg#star"></use></svg><span class="value"></span></span>
        <span class="part mark-label"><span class="dot"></span></span>
      </div>
      <div id="flash" aria-hidden="true"></div>
      <div id="pull" aria-hidden="true"></div>
      <span id="tap-prev" class="tap-hint" aria-hidden="true"><svg class="icon"><use href="/vendor/lucide.svg#chevron-left"></use></svg></span>
      <span id="tap-next" class="tap-hint" aria-hidden="true"><svg class="icon"><use href="/vendor/lucide.svg#chevron-right"></use></svg></span>
      <span id="caption" hidden></span>
      <p id="empty" hidden></p>
    </div>
    <aside id="side">
      <p id="error" role="alert" hidden></p>
      <footer id="actions">
        <div class="row flags">
          <button type="button" class="flag" data-field="pickStatus" data-value="1"><svg class="icon"><use href="/vendor/lucide.svg#flag"></use></svg><span>留用</span></button>
          <button type="button" class="flag" data-field="pickStatus" data-value="-1"><svg class="icon"><use href="/vendor/lucide.svg#ban"></use></svg><span>弃用</span></button>
        </div>
        <div class="row stars">
          <button type="button" data-field="rating" data-value="1" aria-label="1 星"><svg><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="2" aria-label="2 星"><svg><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="3" aria-label="3 星"><svg><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="4" aria-label="4 星"><svg><use href="/vendor/lucide.svg#star"></use></svg></button>
          <button type="button" data-field="rating" data-value="5" aria-label="5 星"><svg><use href="/vendor/lucide.svg#star"></use></svg></button>
        </div>
        <div class="row swatches">
          <button type="button" class="red" data-field="label" data-value="red" aria-label="红色"><svg class="icon check"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="yellow" data-field="label" data-value="yellow" aria-label="黄色"><svg class="icon check"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="green" data-field="label" data-value="green" aria-label="绿色"><svg class="icon check"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="blue" data-field="label" data-value="blue" aria-label="蓝色"><svg class="icon check"><use href="/vendor/lucide.svg#check"></use></svg></button>
          <button type="button" class="purple" data-field="label" data-value="purple" aria-label="紫色"><svg class="icon check"><use href="/vendor/lucide.svg#check"></use></svg></button>
        </div>
      </footer>
    </aside>
  </main>
</body>
</html>
